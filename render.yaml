# Render.com 免费部署 PPOZ 信令服务
# 用法：在 Render 新建 Web Service → 连接本 GitHub 仓库 → 选择「Use render.yaml」即可。
services:
  - type: web
    name: ppoz-signaling
    runtime: node
    plan: free
    region: singapore # 离国内近，延迟更低；可改成 oregon / frankfurt
    branch: master
    buildCommand: npm install
    startCommand: npm start
    # Render 会自动注入 PORT 环境变量（代码已读取 process.env.PORT）
    healthCheckPath: /
    # 免费版 15 分钟无连接会休眠，第一个人加入时可能有几秒冷启动，属正常
